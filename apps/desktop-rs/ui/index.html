<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyphi Teams</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14110f;
        color: #e8ddce;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { text-align: center; max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.35rem; font-weight: 500; letter-spacing: 0.02em; margin: 0 0 0.5rem; }
      p { margin: 0; opacity: 0.65; font-size: 0.9rem; }
      code { font-size: 0.85rem; opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <h1>Glyphi Teams — Rust shell</h1>
      <p>
        The Tauri window is running. The interface is the same React bundle the
        Electron build serves; run <code>bun run desktop:build</code> and copy its
        renderer output into <code>apps/desktop-rs/ui/</code> to load it here.
      </p>
    </main>
  </body>
</html>
